apiVersion: v1
kind: PersistentVolume
metadata:
  name: efs-static
spec:
# here capacity and storage is dummy in EFS, just for api defination
  capacity:
    storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
  storageClassName: "" # for static provisioning storage class should be empty
  persistentVolumeReclaimPolicy: Retain
  csi:
    driver: efs.csi.aws.com
    volumeHandle: efs:fs-09edcb092378114e6