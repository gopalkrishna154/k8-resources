apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  # labels related to deployment resources
  labels:
    project: roboshop122
    tier: frontend
    component: frontend
    purpose: deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      project: roboshop122
      tier: frontend
      component: frontend
    purpose: deployment
    # pod
  template:
    metadata:
      labels:
        project: roboshop122
        tier: frontend
        component: frontend
        purpose: deployment
    spec:
      containers:
      - name: nginx
        image: nginx:1.14.2
        ports:
        - containerPort: 80
