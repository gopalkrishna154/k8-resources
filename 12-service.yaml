apiVersion: v1
kind: Service
metadata:
  name: nginx
  labels:
    project: roboshop1
    environment: dev
spec:
  selector:
    project: roboshop1
    component: frontend
    tier: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    project: roboshop1
    environment: dev
    component: frontend
    tier: frontend
spec:
  containers:
  - name: nginx
    image: nginx:latest



